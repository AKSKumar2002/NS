<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Qubo.in</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#00ffcc">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

    :root {
      --bg: #000000;
      --accent: #00ffcc;
      --accent-glow: rgba(0, 255, 204, 0.4);
      --glass-bg: rgba(22, 22, 24, 0.6);
      --glass-border: rgba(255, 255, 255, 0.08);
      --text-main: #ffffff;
      --text-muted: rgba(255, 255, 255, 0.6);
      --font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }

    html {
      height: 100%;
      margin: 0;
      background: #000;
      overflow: hidden;
    }

    body {
      height: 100%;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      /* Changed from #000 to allow ::before to show */
      font-family: var(--font-family);
      color: var(--text-main);
      perspective: 1000px;
    }

    /* Spectacular Animated Background */
    body::before {
      content: '';
      position: absolute;
      inset: -50%;
      background: radial-gradient(circle at 50% 50%, rgba(76, 29, 149, 0.2), transparent 60%),
        radial-gradient(circle at 80% 20%, rgba(6, 182, 212, 0.15), transparent 50%),
        radial-gradient(circle at 20% 80%, rgba(236, 72, 153, 0.15), transparent 50%);
      filter: blur(60px);
      animation: floatBg 20s ease-in-out infinite alternate;
      z-index: -1;
    }

    @keyframes floatBg {
      0% {
        transform: translate(0, 0) rotate(0deg);
      }

      100% {
        transform: translate(-2%, 2%) rotate(5deg);
      }
    }

    /* The Main Frosty Card */
    .glass {
      width: min(820px, 94%);
      height: 480px;
      padding: 30px;
      box-sizing: border-box;
      border-radius: 32px;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.03) 0%, rgba(255, 255, 255, 0.01) 100%);
      backdrop-filter: blur(40px) saturate(180%);
      -webkit-backdrop-filter: blur(40px) saturate(180%);
      border: 1px solid var(--glass-border);
      box-shadow:
        0 20px 50px -10px rgba(0, 0, 0, 0.5),
        inset 0 0 0 1px rgba(255, 255, 255, 0.05);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      position: relative;
      transition: opacity 0.4s ease, transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    /* Subtle gloss overlay */
    .glass::after {
      content: '';
      position: absolute;
      inset: 0;
      pointer-events: none;
      border-radius: 32px;
      background: linear-gradient(to bottom, rgba(255, 255, 255, 0.05) 0%, transparent 40%);
    }

    canvas {
      width: 100%;
      max-width: 100%;
      height: 220px;
      border-radius: 20px;
      background: linear-gradient(180deg, rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.2));
      border: 1px solid rgba(255, 255, 255, 0.05);
      box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.3);
      display: block;
    }

    .info-group {
      text-align: center;
      z-index: 2;
    }

    .label {
      font-size: 32px;
      font-weight: 700;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #fff 0%, var(--accent) 100%);
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 4px;
    }

    .by {
      font-size: 13px;
      color: var(--text-muted);
      font-weight: 500;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .controls {
      display: flex;
      gap: 16px;
      margin-top: 8px;
      z-index: 2;
    }

    .btn {
      padding: 12px 24px;
      border-radius: 99px;
      border: none;
      cursor: pointer;
      font-weight: 600;
      font-size: 15px;
      font-family: var(--font-family);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
    }

    .btn.primary {
      background: var(--accent);
      color: #000;
      box-shadow: 0 0 20px -5px var(--accent-glow);
    }

    .btn.primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 30px -5px var(--accent-glow);
    }

    .btn.secondary {
      background: rgba(255, 255, 255, 0.05);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .btn.secondary:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.2);
    }

    .btn.stealth {
      background: transparent;
      color: var(--text-muted);
      border: 1px solid transparent;
      padding: 12px 16px;
    }

    .btn.stealth:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.05);
      border-color: rgba(255, 255, 255, 0.05);
    }

    #timer {
      position: absolute;
      top: 24px;
      right: 24px;
      padding: 8px 14px;
      border-radius: 12px;
      background: rgba(0, 0, 0, 0.3);
      color: var(--accent);
      font-weight: 700;
      font-feature-settings: "tnum";
      font-variant-numeric: tabular-nums;
      font-size: 14px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
    }

    /* CHAMELEON MODE (Modern Google Mock) */
    #disguise-layer {
      display: none;
      position: fixed;
      inset: 0;
      background: #ffffff;
      z-index: 9999;
      font-family: arial, sans-serif;
      cursor: default;
      overflow-y: auto;
    }

    /* Top Right Header */
    .gb_header {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      padding: 12px 12px;
      gap: 15px;
      font-size: 13px;
    }

    .gb_link {
      text-decoration: none;
      color: #1f1f1f;
      line-height: 24px;
      opacity: 0.85;
    }

    .gb_link:hover {
      text-decoration: underline;
    }

    .gb_icon_btn {
      padding: 8px;
      border-radius: 50%;
      cursor: pointer;
      fill: #5f6368;
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .gb_icon_btn:hover {
      background: rgba(60, 64, 67, 0.08);
    }

    .gb_avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #a142f4;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      margin-left: 4px;
    }

    /* Center Content */
    .fake-google-center {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 0;
      height: calc(100% - 160px);
      min-height: 480px;
      justify-content: center;
    }

    .fake-logo-img {
      height: 92px;
      width: auto;
      margin-bottom: 25px;
    }

    .fake-search {
      margin: 0 auto;
      width: 584px;
      max-width: 90%;
      height: 46px;
      border: 1px solid #dfe1e5;
      border-radius: 24px;
      display: flex;
      align-items: center;
      padding: 0 14px;
      margin-bottom: 24px;
      transition: all 0.2s;
    }

    .fake-search:hover,
    .fake-search:focus-within {
      background: #fff;
      box-shadow: 0 1px 6px rgba(32, 33, 36, 0.28);
      border-color: rgba(223, 225, 229, 0);
    }

    .fs-icon {
      width: 20px;
      height: 20px;
      fill: #9aa0a6;
      margin-right: 12px;
    }

    .fake-search input {
      flex: 1;
      height: 40px;
      border: none;
      outline: none;
      background: transparent;
      font-size: 16px;
      color: #1f1f1f;
      font-family: arial, sans-serif;
    }

    .fs-mic,
    .fs-lens {
      width: 24px;
      height: 24px;
      cursor: pointer;
      margin-left: 14px;
    }

    .fake-buttons {
      display: flex;
      gap: 12px;
      margin-bottom: 28px;
    }

    .fake-btn {
      background: #f8f9fa;
      border: 1px solid #f8f9fa;
      color: #3c4043;
      padding: 0 16px;
      height: 36px;
      border-radius: 4px;
      font-size: 14px;
      cursor: pointer;
      user-select: none;
    }

    .fake-btn:hover {
      box-shadow: 0 1px 1px rgba(0, 0, 0, 0.1);
      border-color: #dadce0;
      color: #202124;
    }

    .offered-in {
      font-size: 13px;
      color: #3c4043;
      line-height: 28px;
    }

    .offered-in a {
      color: #1a0dab;
      text-decoration: none;
      margin: 0 3px;
    }

    .offered-in a:hover {
      text-decoration: underline;
    }

    /* Footer */
    .fake-footer {
      background: #f2f2f2;
      width: 100%;
      position: absolute;
      bottom: 0;
      font-size: 14px;
      color: #70757a;
    }

    .fake-footer-row {
      padding: 12px 30px;
      display: flex;
      border-top: 1px solid #dadce0;
    }

    .fake-footer-row.country {
      border-bottom: none;
      font-size: 15px;
      color: #70757a;
    }

    .fake-footer-row.links {
      justify-content: space-between;
      flex-wrap: wrap;
    }

    .left-links,
    .right-links {
      display: flex;
      flex-wrap: wrap;
      gap: 28px;
    }

    .fake-footer a {
      color: #70757a;
      text-decoration: none;
    }

    .fake-footer a:hover {
      text-decoration: underline;
    }

    @media (max-width: 600px) {

      /* Mobile specific adjustments for fake google */
      .fake-search {
        width: 90%;
      }

      .fake-footer-row.links {
        justify-content: center;
        gap: 10px;
      }

      .left-links,
      .right-links {
        gap: 15px;
        justify-content: center;
      }

      .fake-google-center {
        height: auto;
        padding-top: 100px;
      }
    }
  </style>
</head>

  <script>
    const canvas = document.getElementById('ecg');
    const ctx = canvas.getContext('2d');
    const DPR = window.devicePixelRatio || 1;
    const accent = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#00ffcc';

    function hexToRgba(hex, alpha) {
      let h = hex.replace('#', '');
      if (h.length === 3) h = h.split('').map(c => c + c).join('');
      const r = parseInt(h.slice(0, 2), 16);
      const g = parseInt(h.slice(2, 4), 16);
      const b = parseInt(h.slice(4, 6), 16);
      return `rgba(${r},${g},${b},${alpha})`;
    }

    let timerStart = 0, timerElapsed = 0, timerRunning = false, timerRaf = null;
    const timerEl = document.getElementById('timer');
    function formatTime(ms) { const s = Math.floor(ms / 1000); const mm = Math.floor(s / 60); const ss = s % 60; return `${String(mm).padStart(2, '0')}:${String(ss).padStart(2, '0')}`; }
    function updateTimerFrame() { const now = performance.now(); const elapsed = timerElapsed + (timerRunning ? now - timerStart : 0); if (timerEl) timerEl.textContent = formatTime(elapsed); if (timerRunning) timerRaf = requestAnimationFrame(updateTimerFrame); }
    function startTimer() { if (timerRunning) return; timerRunning = true; timerStart = performance.now(); updateTimerFrame(); }
    function pauseTimer() { if (!timerRunning) return; timerRunning = false; timerElapsed += performance.now() - timerStart; if (timerRaf) cancelAnimationFrame(timerRaf); }
    function resetTimer() { timerRunning = false; timerElapsed = 0; timerStart = 0; if (timerRaf) cancelAnimationFrame(timerRaf); if (timerEl) timerEl.textContent = '00:00'; }

    let deferredPrompt = null;
    const installBtn = document.getElementById('installBtn');
    function showInstallBtn() { if (installBtn) { installBtn.style.display = 'inline-block'; installBtn.setAttribute('aria-hidden', 'false'); } }
    function hideInstallBtn() { if (installBtn) { installBtn.style.display = 'none'; installBtn.setAttribute('aria-hidden', 'true'); } }
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      showInstallBtn();
    });
    if (installBtn) {
      installBtn.addEventListener('click', async () => {
        if (!deferredPrompt) return;
        deferredPrompt.prompt();
        const choice = await deferredPrompt.userChoice;
        if (choice && choice.outcome === 'accepted') hideInstallBtn();
        deferredPrompt = null;
      });
    }
    window.addEventListener('appinstalled', () => { hideInstallBtn(); deferredPrompt = null; });

    let width = 0, height = 0, buffer = null;
    let beatLen = 40;
    function resize() {
      width = canvas.clientWidth;
      height = canvas.clientHeight;
      canvas.width = Math.floor(width * DPR);
      canvas.height = Math.floor(height * DPR);
      canvas.style.width = width + 'px';
      canvas.style.height = height + 'px';
      ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
      buffer = new Float32Array(width).fill(height / 2);
      beatLen = Math.max(16, Math.round(width * 0.08));
    }
    resize();
    window.addEventListener('resize', resize);

    function makeBeat(len) {
      const mid = height / 2;
      const arr = new Float32Array(len);
      for (let i = 0; i < len; i++) {
        const x = i / len;
        let y = 0;
        y += Math.exp(-Math.pow((x - 0.12) / 0.03, 2)) * 4;
        y += -Math.exp(-Math.pow((x - 0.20) / 0.006, 2)) * 7;
        y += Math.exp(-Math.pow((x - 0.235) / 0.0028, 2)) * 110;
        y += -Math.exp(-Math.pow((x - 0.245) / 0.005, 2)) * 20;
        y += Math.exp(-Math.pow((x - 0.45) / 0.03, 2)) * 8;
        arr[i] = mid - y;
      }
      return arr;
    }

    let mode = 'idle';
    let beatWave = null;
    let beatPos = 0;
    const bpm = 72;
    const beatIntervalMs = 60000 / bpm;
    let lastBeatTime = performance.now();

    function pushSampleIdle() {
      buffer.copyWithin(0, 1);
      buffer[buffer.length - 1] = height / 2;
    }

    function pushSampleECG() {
      buffer.copyWithin(0, 1);
      const now = performance.now();
      if (!beatWave && (now - lastBeatTime) >= beatIntervalMs) {
        beatWave = makeBeat(Math.min(beatLen, 120));
        beatPos = 0;
        lastBeatTime = now;
      }
      let sample = height / 2 + Math.sin(now * 0.003) * 0.8 + (Math.random() - 0.5) * 0.5;
      if (beatWave) {
        sample = beatWave[Math.min(beatPos, beatWave.length - 1)] + (Math.random() - 0.5) * 0.5;
        beatPos++;
        if (beatPos >= beatWave.length) { beatWave = null; beatPos = 0; }
      }
      buffer[buffer.length - 1] = sample;
    }

    function draw() {
      ctx.clearRect(0, 0, width, height);
      ctx.strokeStyle = 'rgba(255,255,255,0.03)';
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(0, height / 2); ctx.lineTo(width, height / 2); ctx.stroke();

      ctx.lineJoin = 'round'; ctx.lineCap = 'round';
      ctx.beginPath();
      for (let i = 0; i < buffer.length; i++) {
        const x = i; const y = buffer[i]; if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.strokeStyle = hexToRgba(accent, 0.14); ctx.lineWidth = 8; ctx.stroke();
      ctx.beginPath();
      for (let i = 0; i < buffer.length; i++) { const x = i; const y = buffer[i]; if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y); }
      ctx.strokeStyle = accent; ctx.lineWidth = 2.8; ctx.stroke();
    }

    let running = false; let raf = null;
    function frame() {
      if (mode === 'idle') pushSampleIdle(); else pushSampleECG();
      draw();
      if (running) raf = requestAnimationFrame(frame);
    }

    function startAnimation() { if (running) return; running = true; lastBeatTime = performance.now(); frame(); }
    function stopAnimation() { if (!running) return; running = false; if (raf) cancelAnimationFrame(raf); }

    function setModeEcg() { mode = 'ecg'; lastBeatTime = performance.now(); }
    function setModeIdle() { mode = 'idle'; beatWave = null; beatPos = 0; buffer.fill(height / 2); }

    startAnimation();

    let wakeLock = null;
    async function requestWakeLock() { try { if ('wakeLock' in navigator) { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => { wakeLock = null; }); } } catch (e) { console.warn('wake lock failed', e); } }
    async function releaseWakeLock() { if (wakeLock) { try { await wakeLock.release(); wakeLock = null; } catch (e) { } } }

    document.getElementById('activateBtn').addEventListener('click', async (evt) => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        try {
          const choice = await deferredPrompt.userChoice;
          if (choice && choice.outcome === 'accepted') hideInstallBtn();
        } catch (e) { }
        deferredPrompt = null;
      }
      await requestWakeLock();
      setModeEcg();
      startTimer();
    });
    document.getElementById('releaseBtn').addEventListener('click', async () => { setModeIdle(); pauseTimer(); await releaseWakeLock(); });

    const originalTitle = document.title;
    let isDisguised = false;
    let oldIcon = null;

    function setFavicon(href) {
      let link = document.querySelector("link[rel*='icon']") || document.createElement('link');
      link.type = 'image/x-icon';
      link.rel = 'shortcut icon';
      if (!oldIcon) oldIcon = link.href;
      link.href = href;
      document.head.appendChild(link);
    }

    document.getElementById('chameleonBtn').addEventListener('click', () => {
      isDisguised = true;
      document.title = 'Google';
      setFavicon(googleFavicon);
      const meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.content = "#ffffff";
      appUI.style.opacity = '0';
      appUI.style.pointerEvents = 'none';
      disguiseUI.style.display = 'block';
    });

    disguiseUI.addEventListener('dblclick', () => {
      if (!isDisguised) return;
      isDisguised = false;
      document.title = originalTitle;
      if (oldIcon) setFavicon(oldIcon);
      const meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.content = "#00ffcc";
      appUI.style.opacity = '1';
      appUI.style.pointerEvents = 'auto';
      disguiseUI.style.display = 'none';
    });

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(e => console.warn('sw register failed', e));
    }

    document.addEventListener('visibilitychange', async () => { if (document.visibilityState === 'visible') { if (mode === 'ecg') try { await requestWakeLock(); } catch (e) { } } });
